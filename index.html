<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>H.E.A.L. 탐구 질문 만들기</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --H-color: #2E75B6; --H-bg: #DEEAF1; --H-light: #f0f7ff;
    --E-color: #375623; --E-bg: #E2EFDA; --E-light: #f0f7ec;
    --A-color: #833C00; --A-bg: #FCE4D6; --A-light: #fff4ee;
    --L-color: #4C3163; --L-bg: #EAE0F0; --L-light: #f5f0fa;
    --ink: #1C1A18; --paper: #FAFAF7; --muted: #6B6560;
    --border: #E0DDD8; --active-color: #2E75B6; --active-bg: #DEEAF1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #F4F1EC;
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── 상단 헤더 ── */
  .top-bar {
    background: #1C1A18;
    color: #E8E4DF;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 12px rgba(0,0,0,.3);
  }
  .top-bar .logo { font-family: 'Nanum Myeongjo', serif; font-size: 20px; font-weight: 700; letter-spacing: .04em; }
  .top-bar .subtitle { font-size: 12px; color: #9B9591; }
  .top-bar .api-status { margin-left: auto; font-size: 12px; padding: 4px 12px; border-radius: 20px; }
  .api-ok { background: #1a4a1a; color: #7fff7f; }
  .api-no { background: #4a1a1a; color: #ff9f9f; cursor: pointer; }

  /* ── 영역 탭 ── */
  .area-tabs {
    display: flex;
    background: #2A2826;
    padding: 8px 16px;
    gap: 6px;
    overflow-x: auto;
  }
  .area-tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: #9B9591;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    white-space: nowrap;
    transition: all .2s;
  }
  .area-tab:hover { background: #3a3835; color: #E8E4DF; }
  .area-tab.active { color: white; font-weight: 600; }
  .area-tab .tab-emoji { font-size: 16px; }

  /* ── 메인 레이아웃 ── */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px 16px;
    display: grid;
    grid-template-columns: 1fr 1.1fr;
    gap: 20px;
  }
  @media (max-width: 768px) {
    .main { grid-template-columns: 1fr; }
  }

  /* ── 배너 ── */
  .banner {
    grid-column: 1 / -1;
    border-radius: 16px;
    padding: 22px 28px;
    color: white;
    position: relative;
    overflow: hidden;
  }
  .banner::after {
    content: '';
    position: absolute;
    right: -20px; top: -20px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,.07);
  }
  .banner-season { font-size: 12px; opacity: .8; letter-spacing: .08em; margin-bottom: 4px; }
  .banner-title { font-family: 'Nanum Myeongjo', serif; font-size: 26px; font-weight: 700; margin-bottom: 2px; }
  .banner-sub { font-size: 13px; opacity: .75; font-style: italic; }
  .banner-badge {
    display: inline-block; margin-top: 12px;
    background: rgba(255,255,255,.18); padding: 4px 14px;
    border-radius: 20px; font-size: 12px;
  }
  .banner-stats { margin-left: auto; text-align: right; }
  .banner-stats .stat-num { font-size: 24px; font-weight: 700; }
  .banner-stats .stat-lbl { font-size: 11px; opacity: .7; }
  .banner-inner { display: flex; align-items: flex-start; }

  /* ── 카드 ── */
  .card {
    background: var(--paper);
    border-radius: 14px;
    border: 1px solid var(--border);
    overflow: hidden;
  }
  .card-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    font-size: 14px; font-weight: 600;
    display: flex; align-items: center; gap: 8px;
    background: white;
  }
  .card-body { padding: 16px 18px; }

  /* ── 시 카드 ── */
  .poem-toggle {
    width: 100%;
    background: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    text-align: left;
    cursor: pointer;
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 13px;
    color: var(--muted);
    display: flex; align-items: center; justify-content: space-between;
    transition: all .2s;
    margin-bottom: 12px;
  }
  .poem-toggle:hover { background: #f5f2ed; }
  .poem-list { display: none; max-height: 320px; overflow-y: auto; }
  .poem-list.open { display: block; }
  .poem-item {
    background: #FAFAF7;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 8px;
  }
  .poem-num { font-size: 11px; font-weight: 500; color: #9B9591; letter-spacing: .06em; margin-bottom: 6px; }
  .poem-text {
    font-family: 'Nanum Myeongjo', serif;
    font-size: 14px; line-height: 2.0;
    color: var(--ink); white-space: pre-line;
    padding-bottom: 10px; margin-bottom: 10px;
    border-bottom: 1px dashed var(--border);
  }
  .poem-meaning { font-size: 12px; color: var(--muted); line-height: 1.7; white-space: pre-line; }

  /* ── 안내·순서 ── */
  .notice-box {
    background: #FFF8E7;
    border: 1px solid #FFD966;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 12.5px; color: #7A5800; line-height: 1.65;
    margin-bottom: 14px;
  }
  .step-list { margin-bottom: 14px; }
  .step-row {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 8px 0; border-bottom: 1px solid #F0EDE8;
  }
  .step-dot {
    width: 22px; height: 22px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: white; flex-shrink: 0;
  }
  .step-text { font-size: 13px; line-height: 1.5; }
  .step-tip { font-size: 11px; color: #9B9591; font-style: italic; margin-top: 2px; }

  /* ── 시작 문장 ── */
  .starter-box {
    background: #F7F5F0;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 13px; line-height: 1.75;
    white-space: pre-line;
    color: var(--ink);
    margin-bottom: 8px;
    position: relative;
  }
  .copy-btn {
    position: absolute; top: 10px; right: 10px;
    background: white; border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 10px;
    font-size: 11px; cursor: pointer; color: var(--muted);
    transition: all .15s;
  }
  .copy-btn:hover { background: #f0ede8; }

  /* ── 채팅 ── */
  .chat-area {
    height: 360px;
    overflow-y: auto;
    padding: 12px 4px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .chat-empty {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 13px; text-align: center;
    line-height: 1.8;
  }
  .msg-row { display: flex; gap: 8px; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.ai { justify-content: flex-start; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: #F0EDE8; border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; flex-shrink: 0; margin-top: 2px;
  }
  .bubble {
    padding: 10px 14px; border-radius: 18px;
    max-width: 80%; font-size: 13.5px; line-height: 1.65;
    word-break: break-word; white-space: pre-wrap;
  }
  .bubble.user { border-radius: 18px 4px 18px 18px; color: white; }
  .bubble.ai { background: #F7F5F0; color: var(--ink); border-radius: 4px 18px 18px 18px; border: 1px solid var(--border); }
  .bubble.guide { background: #FFF8E7; color: #7A5800; border-radius: 4px 18px 18px 18px; border: 1px solid #FFD966; }
  .thinking { color: var(--muted); font-size: 12px; font-style: italic; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

  /* ── 채팅 입력 ── */
  .chat-input-row {
    display: flex; gap: 8px;
    padding: 12px 18px;
    border-top: 1px solid var(--border);
    background: white;
  }
  .chat-input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 13.5px;
    font-family: 'Noto Sans KR', sans-serif;
    resize: none; height: 44px; overflow: hidden;
    outline: none;
    transition: border-color .2s;
  }
  .chat-input:focus { border-color: #aaa; }
  .send-btn {
    background: var(--active-color);
    color: white; border: none; border-radius: 10px;
    padding: 0 18px; cursor: pointer; font-size: 18px;
    transition: opacity .15s;
    flex-shrink: 0;
  }
  .send-btn:hover { opacity: .85; }
  .send-btn:disabled { opacity: .4; cursor: default; }
  .clear-btn {
    background: none; border: 1px solid var(--border);
    border-radius: 10px; padding: 0 14px;
    color: var(--muted); cursor: pointer; font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    flex-shrink: 0;
  }
  .clear-btn:hover { background: #f0ede8; }

  /* ── 질문 기록 ── */
  .q-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .q-text-input {
    flex: 1; border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif; outline: none;
  }
  .q-type-select {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12px;
    font-family: 'Noto Sans KR', sans-serif;
    background: white; outline: none; color: var(--ink);
  }
  .add-q-btn {
    background: var(--active-color); color: white;
    border: none; border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif;
    white-space: nowrap;
  }
  .q-item {
    display: flex; align-items: flex-start; gap: 8px;
    padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: #F7F5F0;
    font-size: 13px; margin-bottom: 6px;
  }
  .q-badge {
    font-size: 10px; font-weight: 500;
    padding: 2px 8px; border-radius: 10px; white-space: nowrap; flex-shrink: 0;
  }
  .q-del { margin-left: auto; background: none; border: none; cursor: pointer; color: #bbb; font-size: 14px; flex-shrink: 0; }
  .q-del:hover { color: #e55; }

  /* ── 프로젝트 설계 ── */
  .design-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .design-label { font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--muted); }
  .design-textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-size: 13px;
    font-family: 'Noto Sans KR', sans-serif; height: 100px; resize: none; outline: none;
    background: #FAFAF7;
    transition: border-color .2s;
  }
  .design-textarea:focus { border-color: #aaa; }

  /* ── 저장 버튼 ── */
  .save-btn {
    width: 100%; padding: 12px;
    background: var(--active-color); color: white;
    border: none; border-radius: 10px; cursor: pointer;
    font-size: 14px; font-weight: 600;
    font-family: 'Noto Sans KR', sans-serif;
    transition: opacity .15s;
    margin-top: 10px;
  }
  .save-btn:hover { opacity: .88; }

  /* ── API 키 모달 ── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    z-index: 999; padding: 16px;
  }
  .modal-box {
    background: white; border-radius: 16px;
    padding: 28px; max-width: 420px; width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .modal-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .modal-desc { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 16px; }
  .modal-input {
    width: 100%; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    outline: none; margin-bottom: 12px;
    letter-spacing: .04em;
  }
  .modal-input:focus { border-color: #888; }
  .modal-btn {
    width: 100%; padding: 11px; border: none; border-radius: 8px;
    background: #1C1A18; color: white; font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif; cursor: pointer;
    font-weight: 600;
  }
  .modal-btn:hover { opacity: .88; }
  .modal-note { font-size: 11px; color: #bbb; margin-top: 10px; text-align: center; line-height: 1.6; }

  section-title {
    display: block; font-size: 13.5px; font-weight: 600;
    margin-bottom: 10px; margin-top: 4px;
  }
  .divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

  /* 스크롤바 */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
</style>
</head>
<body>

<!-- 상단 헤더 -->
<div class="top-bar">
  <div>
    <div class="logo">🌿 H.E.A.L.</div>
    <div class="subtitle">어부사시사 탐구 질문 만들기</div>
  </div>
  <div class="api-status api-ok" id="apiStatusBadge">✓ Gemini AI 연결됨</div>
</div>

<!-- 영역 탭 -->
<div class="area-tabs" id="areaTabs"></div>

<!-- 메인 콘텐츠 -->
<div class="main" id="mainContent"></div>

<script>
// ── 데이터 ──────────────────────────────────────────────────
const POEM_DATA = {
  H: [
    { num:"춘사 1수", 원문:"앞개예 안개 걷고 뒫뫼희 해 비췬다\n배 띄워라 배 띄워라\n밤물은 거의 지고 낮물이 밀려온다\n강촌에 온갖 꽃이 먼 빛이 더욱 좋다", 풀이:"앞바다에 안개 걷히고 뒷산에 해 비친다\n배 띄워라 배 띄워라\n밤물은 거의 지고 낮물이 밀려온다\n강마을의 온갖 꽃이 멀리서 보니 더욱 좋다" },
    { num:"춘사 2수", 원문:"날이 덥도다 물 위에 고기 뜬다\n닻 들어라 닻 들어라\n갈매기 둘씩 셋씩 오락가락 하는구나\n낚싯대 쥐어 있다 탁주병은 실었느냐", 풀이:"날이 덥구나 물 위에 고기가 떠오른다\n닻 들어라 닻 들어라\n갈매기가 둘씩 셋씩 오락가락 하는구나\n낚싯대 쥐어 있다 탁주병은 실었느냐" },
    { num:"춘사 3수", 원문:"동풍이 건듯 부니 물결이 곱게 인다\n돛 달아라 돛 달아라\n동호를 돌아보며 서호로 가자\n앞산이 지나가고 뒷산이 나아온다", 풀이:"동풍이 살짝 부니 물결이 곱게 일어난다\n돛 달아라 돛 달아라\n동호를 돌아보며 서호로 가자꾸나\n앞산이 지나가고 뒷산이 나타난다" },
    { num:"춘사 4수", 원문:"우는 것이 뻐꾸기인가 푸른 것이 버들숲인가\n배 저어라 배 저어라\n어촌 두어 집이 안개 속에 들락날락\n맑고 깊은 못에 온갖 고기 뛰노는구나", 풀이:"우는 것이 뻐꾸기인가 푸른 것이 버들숲인가\n배 저어라 배 저어라\n어촌 두어 집이 안개 속에 들락날락\n맑고 깊은 물에 온갖 고기 뛰놀고 있구나" },
    { num:"춘사 5수", 원문:"고운 볕이 쬐었는데 물결이 기름 같다\n배 저어라 배 저어라\n그물을 던져둘까 낚시를 놓으리까\n탁영가의 흥이 나니 고기도 잊을로다", 풀이:"고운 햇볕이 쬐었는데 물결이 기름 같이 빛난다\n배 저어라 배 저어라\n그물을 던져둘까 낚시를 드리울까\n탁영가 흥취가 일어나니 고기도 잊겠구나" },
    { num:"춘사 6수", 원문:"석양이 비껴 있으니 그만하고 돌아가자\n돛 내려라 돛 내려라\n버드나무와 꽃은 굽이굽이 새롭구나\n삼공이 부러울쏘냐 만사를 생각하랴", 풀이:"석양이 기울었으니 그만하고 돌아가자꾸나\n돛 내려라 돛 내려라\n언덕 버들 물가 꽃이 굽이굽이 새롭구나\n삼공이 부러울쏘냐 세상 만사를 생각하랴" },
    { num:"춘사 7수", 원문:"방초를 밟아보며 난초도 뜯어보자\n배 세워라 배 세워라\n일엽편주에 실은 것이 무엇인고\n갈 때는 안개더니 올 때는 달이로다", 풀이:"방초를 밟아보며 난초도 뜯어보자꾸나\n배 세워라 배 세워라\n작은 배 한 척에 실은 것이 무엇인가\n갈 때는 안개더니 돌아올 때는 달빛이로다" },
    { num:"춘사 8수", 원문:"취하여 누웠다가 여울 아래 내리려다\n배 매어라 배 매어라\n떨어진 꽃잎이 흘러오니 무릉도원이 가깝도다\n인간 세상 홍진을 얼마나 가렸느냐", 풀이:"취하여 누웠다가 여울 아래로 내려가려다\n배 매어라 배 매어라\n떨어진 꽃잎이 흘러오니 무릉도원이 가깝구나\n인간 세상 속세의 먼지를 얼마나 가렸느냐" },
    { num:"춘사 9수", 원문:"낚싯줄 거두어 놓고 봉창의 달을 보자\n닻 내려라 닻 내려라\n벌써 밤이 들었느냐 두견새 소리 맑게 난다\n남은 흥이 무궁하니 갈 길을 잊었더라", 풀이:"낚싯줄 거두어 놓고 배 창문으로 달을 보자\n닻 내려라 닻 내려라\n벌써 밤이 들었느냐 두견새 소리 맑게 나는구나\n남은 흥이 끝없으니 돌아갈 길을 잊었더라" },

// ── 채팅 메시지 렌더 ────────────────────────────────────────
function renderChatMessages(msgs, a) {
  if (!msgs.length) return '';
  return msgs.map(m => {
    if (m.role === 'user') {
      return `<div class="msg-row user">
        <div class="bubble user" style="background:${a.color}">${escHtml(m.content)}</div>
      </div>`;
    }
    const isGuide = /고운 말|바른 말|선생님께|기분이 나쁠/.test(m.content);
    return `<div class="msg-row ai">
      <div class="avatar">🌿</div>
      <div class="bubble ${isGuide?'guide':'ai'}">${escHtml(m.content)}</div>
    </div>`;
  }).join('');
}

function scrollChat() {
  const el = document.getElementById('chatArea');
  if (el) el.scrollTop = el.scrollHeight;
}

// ── 채팅 기능 ────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize(el) {
  el.style.height = '44px';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;

  const s = state[curArea];
  const a = AREAS[curArea];

  s.chat.push({ role: 'user', content: text });
  input.value = '';
  input.style.height = '44px';

  const sendBtn = document.getElementById('sendBtn');
  if (sendBtn) sendBtn.disabled = true;

  // 채팅 UI 즉시 업데이트 + 로딩
  const chatArea = document.getElementById('chatArea');
  if (chatArea) {
    chatArea.innerHTML = renderChatMessages(s.chat, a) +
      '<div class="msg-row ai"><div class="avatar">🌿</div><div class="bubble ai thinking">AI가 생각하는 중...</div></div>';
    scrollChat();
  }

  // Gemini API 호출 (재시도 포함)
  const MAX_RETRY = 3;
  let reply = null;

  for (let attempt = 1; attempt <= MAX_RETRY; attempt++) {
    try {
      // Gemini 형식으로 대화 히스토리 변환
      const geminiHistory = [];
      for (const m of s.chat.slice(0, -1)) {
        geminiHistory.push({
          role: m.role === 'user' ? 'user' : 'model',
          parts: [{ text: m.content }]
        });
      }

      // contents는 반드시 user 메시지로 시작해야 함 (Gemini API 규칙)
      // geminiHistory가 model로 시작하면 400 오류 발생 → user만 필터링
      const validHistory = [];
      for (let i = 0; i < geminiHistory.length; i++) {
        if (i === 0 && geminiHistory[i].role !== 'user') continue;
        validHistory.push(geminiHistory[i]);
      }

      const body = {
        systemInstruction: { parts: [{ text: a.system }] },
        contents: [
          ...validHistory,
          { role: 'user', parts: [{ text: text }] }
        ],
        generationConfig: { maxOutputTokens: 1000, temperature: 0.7 }
      };

      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`,
        { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      );

      const data = await res.json();

      if (data.error) {
        // 429 = 분당 요청 초과 → 재시도
        if (data.error.code === 429 && attempt < MAX_RETRY) {
          const wait = attempt * 2000;
          const chatArea = document.getElementById('chatArea');
          if (chatArea) {
            chatArea.innerHTML = renderChatMessages(s.chat, a) +
              `<div class="msg-row ai"><div class="avatar">🌿</div><div class="bubble ai thinking">잠깐 기다려봐요... (${attempt}번째 시도 중)</div></div>`;
            scrollChat();
          }
          await new Promise(r => setTimeout(r, wait));
          continue;
        }
        const errMap = { 400:'❌ 요청이 잘못됐어요.', 403:'❌ API 키를 확인해주세요.', 429:'❌ 지금 요청이 많아요. 잠깐 후 다시 눌러봐요!', 500:'❌ AI 서버 오류예요. 잠시 후 다시 시도해주세요.' };
        reply = errMap[data.error.code] || ('❌ 오류: ' + data.error.message);
      } else {
        reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '응답을 받지 못했어요.';
      }
      break;

    } catch(e) {
      if (attempt < MAX_RETRY) {
        await new Promise(r => setTimeout(r, attempt * 1500));
        continue;
      }
      reply = '❌ 네트워크 오류가 발생했어요. 인터넷 연결을 확인해주세요.';
    }
  }

  s.chat.push({ role: 'assistant', content: reply || '응답을 받지 못했어요.' });

  // 재렌더
  const chatArea2 = document.getElementById('chatArea');
  if (chatArea2) {
    chatArea2.innerHTML = renderChatMessages(s.chat, a);
    scrollChat();
  }
  const sendBtn2 = document.getElementById('sendBtn');
  if (sendBtn2) sendBtn2.disabled = false;

  // 통계 업데이트
  const banner = document.querySelector('.stat-num');
  if (banner) renderBannerStats();
}

function saveRecord() {
  const a = AREAS[curArea];
  const s = state[curArea];
  const fq = document.getElementById('finalQInput')?.value || s.finalQ;
  const act = document.getElementById('activityInput')?.value || s.activity;
  const now = new Date().toLocaleString('ko-KR');

  const guideCount = s.chat.filter(m => m.role==='assistant' && /고운 말|바른 말|선생님께/.test(m.content)).length;
  const userMsgs = s.chat.filter(m=>m.role==='user');

  let lines = [
    'H.E.A.L. 프로젝트 탐구 질문 및 활동 설계 기록',
    '='.repeat(48),
    `영역: ${a.num} ${a.title} (${a.titleReal})`,
    `계절: ${a.season}`,
    `탐구 목표: ${a.goal} | 탐구 주제: ${a.theme}`,
    `저장 시각: ${now}`,
    '='.repeat(48), '',
  ];
  if (fq) lines.push(`[ ⭐ 탐구 질문 ]\n  ${fq}\n`);
  if (act) lines.push(`[ 🗺 활동 설계 ]\n  ${act}\n`);
  if (s.questions.length) {
    lines.push(`[ 대화 중 기록한 질문 (${s.questions.length}개) ]`);
    s.questions.forEach((q,i) => lines.push(`  ${i+1}. [${q.type}] ${q.text}`));
    lines.push('');
  }
  if (guideCount) lines.push(`[ 📢 생활지도 기록 ]\n  부적절한 표현 사용으로 AI 지도 ${guideCount}회 발생\n`);
  if (s.chat.length) {
    lines.push(`[ AI 대화 기록 (${userMsgs.length}회) ]`);
    s.chat.forEach(m => lines.push(`\n${m.role==='user'?'학생':'AI'}: ${m.content}`));
  }

  const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const today = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const a2 = document.createElement('a');
  a2.href = url; a2.download = `HEAL_${a.num.replace('영역','')}영역_탐구질문_${today}.txt`;
  a2.click();
  URL.revokeObjectURL(url);
}

// ── 유틸 ────────────────────────────────────────────────────
function togglePoem() {
  const list = document.getElementById('poemList');
  const arrow = document.getElementById('poemArrow');
  list.classList.toggle('open');
  arrow.textContent = list.classList.contains('open') ? '▲' : '▼';
}

function copyStarter() {
  const text = AREAS[curArea].starter;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    if (btn) { btn.textContent = '✓ 복사됨'; setTimeout(()=>{ btn.textContent='복사'; }, 1500); }
  });
}

function escHtml(str) {
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}

// ── 초기화 ──────────────────────────────────────────────────
updateApiStatus();

renderTabs();
renderMain();
</script>
</body>
</html>
